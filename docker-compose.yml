services:

  # ── FastAPI — Slack webhook + entregables estáticos ─────────────────────────
  mach-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mach-api
    command: uvicorn api.slack_webhook:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      # Forzar SQLite y apuntar al volumen compartido
      CHECKPOINTER: sqlite
      SQLITE_PATH: /app/data/mach_cycle.db
    ports:
      - "8000:8000"
    volumes:
      # Código fuente montado para hot-reload con uvicorn --reload
      - .:/app:z
      # Base de datos SQLite compartida con el dashboard
      - mach-data:/app/data
      # Entregables generados por los agentes
      - mach-outputs:/app/outputs
      # Cache del modelo ONNX de ChromaDB (79MB, se descarga solo la primera vez)
      - chroma-cache:/root/.cache/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Vue.js Frontend (Race Control) ───────────────────────────────────────────
  mach-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mach-frontend
    ports:
      - "5173:80"
    depends_on:
      - mach-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# ── Volúmenes nombrados ────────────────────────────────────────────────────────
volumes:
  # Persiste mach_cycle.db entre reinicios y entre servicios
  mach-data:
  # Persiste PRDSPECS.md, ARQSPECS.md, etc. entre reinicios y entre servicios
  mach-outputs:
  # Cache del modelo ONNX de ChromaDB — evita re-descargar 79MB en cada restart
  chroma-cache: